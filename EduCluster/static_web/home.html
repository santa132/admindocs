<!DOCTYPE html>
<html>
<head>
    <title>AIMC |Education Cluster</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f7f7f7;
        }
        
        header {
            background-color: #333;
            color: white;
            text-align: center;
            padding: 10px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        #logo {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
        }
        
        #logo img {
            width: 200px;
            height: auto;
            margin-right: 10px;
        }
        
        #logo h1 {
            display: inline;
            font-size: 24px;
            margin: 0;
            vertical-align: middle;
        }
        
        .buttons {
            display: flex;
            justify-content: center;
            margin-top: 20px;
        }
        
        .button {
            margin: 0 10px;
            text-align: center;
        }
        
        .button img {
            width: 100px;
            height: 100px;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            cursor: pointer;
            transition: transform 0.3s;
        }
        
        .button h2 {
            margin: 10px 0 0;
            font-size: 16px;
        }
        
        .button img:hover {
            transform: scale(1.1);
        }
    </style>
</head>
<body>
    <header>
        <div id="logo">
            <img src="logo.png" alt="Logo">
            <h1>Education Cluster</h1>
        </div>
    </header>
    
    <div class="buttons">
        <div class="button">
            <a href="http://192.168.33.15/">
                <img src="jupyter.png" alt="Jupyter">
                <h2>JupyterLab</h2>
            </a>
        </div>
        <div class="button">
            <a href="http://192.168.33.15:8888/moodle/">
                <img src="moodle.png" alt="Moodle">
                <h2>Moodle</h2>
            </a>
        </div>
        <div class="button">
            <a href="https://gpucluster.gitlab.io/docs/edu-cluster/guide.html">
                <img src="userguide.png" alt="User guide">
                <h2>User guide</h2>
            </a>
        </div>
        <div class="button">
            <a href="http://192.168.33.15:8888/moodle/login/change_password.php">
                <img src="changepw.png" alt="Change password">
                <h2>Change password</h2>
            </a>
        </div>
    </div>
</body>
</html>
